name: Inspect verifier dependency notices
on:
  pull_request:
permissions:
  contents: read
jobs:
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Inspect exact registry sources
        run: |
          cargo fetch --locked
          python3 - <<'PY'
          import glob,os,base64,zlib,json
          results={}
          for spec in ['ring-0.17.14','untrusted-0.9.0','getrandom-0.2.17']:
              root=glob.glob(os.path.expanduser('~/.cargo/registry/src/*/'+spec))[0]
              names=[n for n in os.listdir(root) if n.upper().startswith(('LICENSE','COPYING','NOTICE')) and os.path.isfile(os.path.join(root,n))]
              results[spec]={n:open(os.path.join(root,n),'rb').read().decode('utf-8') for n in names}
          s=base64.b64encode(zlib.compress(json.dumps(results).encode(),9)).decode()
          print('::notice::SIZE %s' % len(s))
          for i in range(0,len(s),3500): print('::notice::NOTICES%02d %s' % (i//3500,s[i:i+3500]))
          PY
