name: Dependency security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install audit tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - name: Check committed lockfile for advisories
        run: |
          set -o pipefail
          cargo audit --color never 2>&1 | tee /tmp/audit.log || { python3 -c 'print("::error::" + open("/tmp/audit.log").read()[-12000:].replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D"))'; exit 1; }
      - name: Check dependency policy
        if: always()
        run: |
          set -o pipefail
          cargo deny --locked --color never check 2>&1 | tee /tmp/deny.log || { python3 -c 'print("::error::" + "\n".join(line for line in open("/tmp/deny.log") if "error[" in line or "error:" in line or "license" in line or "checks" in line)[:12000].replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D"))'; exit 1; }
