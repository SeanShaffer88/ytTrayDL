[package]
name = "yttraydl-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ring = "0.17.14"
sha2 = { version = "0.11.1", default-features = false }
yttraydl = { path = ".." }

[[bin]]
name = "url_input"
path = "fuzz_targets/url_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clipboard_input"
path = "fuzz_targets/clipboard_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "release_signature"
path = "fuzz_targets/release_signature.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
