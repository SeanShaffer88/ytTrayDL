# Review notices and remediation plans in docs/DEPENDENCIES.md.
[graph]
all-features = true

[advisories]
# No known vulnerabilities are ignored. RustSec informational unmaintained
# and unsound notices are reported rather than converted to vulnerability bans.
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016",
  "CC0-1.0", "MPL-2.0", "BSL-1.0", "Unlicense", "OFL-1.1", "Ubuntu-font-1.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
