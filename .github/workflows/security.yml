name: Dependency security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install audit tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - name: Check committed lockfile for advisories
        run: |
          set -o pipefail
          cargo audit --color never 2>&1 | tee /tmp/audit.log || { tail -35 /tmp/audit.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
      - name: Check dependency policy
        if: always()
        run: |
          set -o pipefail
          cargo deny --locked --color never check 2>&1 | tee /tmp/deny.log || { tail -35 /tmp/deny.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
