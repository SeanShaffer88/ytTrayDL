name: Resolve signature verifier dependencies
on:
  pull_request:
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve and report lockfile
        run: |
          cargo update --workspace
          git diff -- Cargo.lock > changes.diff
          python3 - <<'PY'
          import base64,zlib
          s = base64.b64encode(zlib.compress(open('changes.diff','rb').read(),9)).decode()
          assert len(s) < 3600, len(s)
          print('::notice::LOCKDIFF ' + s)
          PY
