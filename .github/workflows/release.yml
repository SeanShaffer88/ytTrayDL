name: Release packages

on:
  workflow_dispatch:
    inputs:
      repair_run:
        description: "Run ID containing checked release-packages to verify and publish an existing draft"
        required: false
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-release:
    if: github.event_name != 'workflow_dispatch' || inputs.repair_run == ''
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate tag and notes
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid application version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version must match' }
          if (-not (Test-Path "docs/RELEASE-$version.md")) { throw 'Versioned release notes are required' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run native tests and build release executable
        shell: pwsh
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed' }
          cargo build --release --locked --bin yttraydl
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
      - name: Build owned process runner for media validation
        shell: pwsh
        run: ./tools/Build-InstallerStateProbe.ps1 -Destination "$env:RUNNER_TEMP/process-runner"
      - name: Resolve hash-pinned real media tools
        shell: pwsh
        run: ./tools/Get-FieldTools.ps1 -Destination "$env:RUNNER_TEMP/field-tools" -ProcessRunner "$env:RUNNER_TEMP/process-runner/InstallerStateProbe.exe"
      - name: Test real converter media
        shell: pwsh
        run: |
          $env:YTTRAYDL_TEST_FFMPEG = $env:FIELD_FFMPEG
          $env:YTTRAYDL_TEST_FFPROBE = $env:FIELD_FFPROBE
          cargo test --locked --test converter_media
          if ($LASTEXITCODE -ne 0) { throw "Converter media tests failed: $LASTEXITCODE" }
      - name: Run real-media field validation
        shell: pwsh
        run: |
          cargo build --locked --features field-validation --bin field_validation
          if ($LASTEXITCODE -ne 0) { throw 'Media harness build failed' }
          $harness = (Resolve-Path './target/debug/field_validation.exe').Path
          ./tools/Invoke-MediaFieldValidation.ps1 -Harness $harness -YtDlp $env:FIELD_YTDLP -FFmpeg $env:FIELD_FFMPEG -FFprobe $env:FIELD_FFPROBE -Root "$env:RUNNER_TEMP/media-evidence" -Scenario all -TimeoutSeconds 120
          if ($LASTEXITCODE -ne 0) { throw "Media field assertions failed: $LASTEXITCODE" }
      - name: Prepare public media evidence
        shell: pwsh
        run: |
          ./tools/Export-ReleaseMediaEvidence.ps1 -Root "$env:RUNNER_TEMP/media-evidence" -Provenance "$env:RUNNER_TEMP/field-tools/provenance.json" -Output "media-evidence.json" -Commit $env:GITHUB_SHA -ConverterTestsPassed
      - name: Install Inno Setup 6.7.1
        run: choco install innosetup --version=6.7.1 --no-progress --yes
      - name: Verify Inno compiler engine
        shell: pwsh
        run: |
          $probeRoot = Join-Path $env:RUNNER_TEMP 'release-inno-probe'
          $null = New-Item -ItemType Directory -Path $probeRoot
          $probe = Join-Path $probeRoot 'probe.iss'
          @'
          [Setup]
          AppName=Compiler Version Probe
          AppVersion=1
          DefaultDirName={localappdata}\ytTrayDL-Compiler-Probe
          PrivilegesRequired=lowest
          CreateAppDir=no
          Uninstallable=no
          '@ | Set-Content -LiteralPath $probe -Encoding utf8NoBOM
          $banner = @(& 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/O$probeRoot" '/Fversion-probe' $probe)
          $code = $LASTEXITCODE
          $banner | Write-Output
          if ($code -ne 0 -or ($banner -join "`n") -notmatch 'Compiler engine version: Inno Setup 6\.7\.1(?:\s|$)') { throw 'Unexpected Inno compiler engine' }
      - name: Build and verify packages
        shell: pwsh
        run: |
          try {
            $ErrorActionPreference = 'Stop'
            $version = $env:APP_VERSION
            $exe = (Resolve-Path 'target/release/yttraydl.exe').Path
            $actualVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe).FileVersion.Trim()
            if ($actualVersion -notmatch "^$([regex]::Escape($version))(?:\.0)?$") { throw "Unexpected application version: $actualVersion" }
            $reader = [IO.BinaryReader]::new([IO.File]::OpenRead($exe))
            try {
              $reader.BaseStream.Position = 0x3c
              $offset = $reader.ReadInt32()
              $reader.BaseStream.Position = $offset
              if ($reader.ReadUInt32() -ne 0x4550 -or $reader.ReadUInt16() -ne 0x8664) { throw 'Application is not a Windows x64 PE' }
            } finally { $reader.Dispose() }
            $null = New-Item -ItemType Directory -Path release, portable
            Copy-Item $exe, README.md, LICENSE, THIRD-PARTY-NOTICES.txt -Destination portable
            [IO.File]::WriteAllText((Join-Path (Resolve-Path portable).Path 'portable.txt'), '')
            $zip = "release/ytTrayDL-v$version-windows-x64.zip"
            Compress-Archive -Path portable/* -DestinationPath $zip
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
            try {
              $expected = @('LICENSE', 'README.md', 'THIRD-PARTY-NOTICES.txt', 'portable.txt', 'yttraydl.exe') | Sort-Object
              $actual = @($archive.Entries | ForEach-Object { $_.FullName }) | Sort-Object
              if (Compare-Object $expected $actual) { throw "Unexpected portable inventory: $actual" }
              $item = $archive.GetEntry('yttraydl.exe')
              $sha = [Security.Cryptography.SHA256]::Create()
              $stream = $item.Open()
              try { $insideHash = [Convert]::ToHexString($sha.ComputeHash($stream)) } finally { $stream.Dispose(); $sha.Dispose() }
              if ($insideHash -ne (Get-FileHash $exe -Algorithm SHA256).Hash) { throw 'Portable executable hash mismatch' }
            } finally { $archive.Dispose() }
            & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$version" installer/yttraydl.iss
            if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
            $setup = "dist/ytTrayDL-Setup-v$version-windows-x64.exe"
            if (-not (Test-Path $setup)) { throw 'Expected installer is missing' }
            $setupVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $setup).Path).FileVersion.Trim()
            if ($setupVersion -notmatch "^$([regex]::Escape($version))(?:\.0)?$") { throw "Unexpected installer version: $setupVersion" }
            Copy-Item $setup release/
            Copy-Item media-evidence.json "release/ytTrayDL-v$version-real-media-evidence.json"
            $files = Get-ChildItem release -File | Sort-Object Name
            if ($files.Count -ne 3) { throw 'Unexpected package inventory' }
            $sums = @($files | ForEach-Object { "$(($_ | Get-FileHash -Algorithm SHA256).Hash.ToLower())  $($_.Name)" })
            [IO.File]::WriteAllLines((Join-Path (Resolve-Path release).Path 'SHA256SUMS.txt'), $sums)
          } catch {
            $message = "$($_.Exception.Message)`n$($_.InvocationInfo.PositionMessage)".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Package preflight::$message"
            throw
          }
      - name: Upload checked packages as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release/*
          if-no-files-found: error
      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $assets = @(Get-ChildItem -LiteralPath release -File | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --title "ytTrayDL v$version" --notes-file "docs/RELEASE-$version.md" @assets
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          $releaseUrl = gh release view $env:GITHUB_REF_NAME --json apiUrl --jq .apiUrl
          if ($LASTEXITCODE -ne 0 -or -not $releaseUrl) { throw 'Draft release lookup failed' }
          $published = gh api "$releaseUrl" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.assets.Count -ne $assets.Count) { throw 'Release asset listing failed' }
          foreach ($asset in $assets) {
            $file = Get-Item -LiteralPath $asset
            $remote = @($published.assets | Where-Object { $_.name -eq $file.Name })
            $digest = "sha256:$((Get-FileHash $asset -Algorithm SHA256).Hash.ToLower())"
            if ($remote.Count -ne 1 -or $remote[0].state -ne 'uploaded' -or $remote[0].size -ne $file.Length -or $remote[0].digest -ne $digest) { throw "Uploaded asset did not verify: $($file.Name)" }
          }
          gh release edit $env:GITHUB_REF_NAME --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

  repair-draft:
    if: github.event_name == 'workflow_dispatch' && inputs.repair_run != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify original build artifacts and publish draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.repair_run }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid run ID'; exit 1; }
          VERSION=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid version'; exit 1; }
          TAG="v$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > tag.json
          python3 -c 'import json,sys; r=json.load(open("run.json")); t=json.load(open("tag.json")); assert r["event"] == "push" and r["head_branch"] == sys.argv[1] and r["head_sha"] == t["object"]["sha"], "Run does not build the release tag"' "$TAG"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" > jobs.json
          python3 -c 'import json; j=json.load(open("jobs.json"))["jobs"]; assert len(j)==1; s={x["name"]: x["conclusion"] for x in j[0]["steps"]}; assert all(s.get(n)=="success" for n in ("Validate tag and notes", "Run native tests and build release executable", "Resolve hash-pinned real media tools", "Test real converter media", "Run real-media field validation", "Prepare public media evidence", "Verify Inno compiler engine", "Build and verify packages", "Upload checked packages as build artifacts")), "Release build checks did not pass"'
          gh run download "$RUN_ID" --name release-packages --dir checked
          RELEASE_URL=$(gh release view "$TAG" --json apiUrl --jq .apiUrl)
          gh api "$RELEASE_URL" > release.json
          python3 - "$VERSION" <<'PYCODE'
          import hashlib, json, pathlib, sys
          version = sys.argv[1]
          root = pathlib.Path('checked')
          expected = {'SHA256SUMS.txt', f'ytTrayDL-Setup-v{version}-windows-x64.exe', f'ytTrayDL-v{version}-windows-x64.zip', f'ytTrayDL-v{version}-real-media-evidence.json'}
          assert {p.name for p in root.iterdir()} == expected, 'Unexpected build artifact inventory'
          release = json.load(open('release.json'))
          assert release['draft'] and release['tag_name'] == f'v{version}', 'Expected the matching draft release'
          remote = {a['name']: a for a in release['assets']}
          assert set(remote) == expected, 'Unexpected release asset inventory'
          for name in expected:
              data = (root / name).read_bytes()
              asset = remote[name]
              assert asset['state'] == 'uploaded' and asset['size'] == len(data)
              assert asset['digest'] == 'sha256:' + hashlib.sha256(data).hexdigest(), f'Uploaded digest mismatch: {name}'
          sums = {}
          for line in (root / 'SHA256SUMS.txt').read_text().splitlines():
              digest, name = line.split('  ', 1)
              sums[name] = digest
          assert set(sums) == expected - {'SHA256SUMS.txt'}
          for name, digest in sums.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, f'Checksum mismatch: {name}'
          PYCODE
          gh release edit "$TAG" --draft=false
