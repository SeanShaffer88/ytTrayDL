name: Resolve signature verifier dependencies
on:
  pull_request:
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve and report lockfile
        run: |
          cargo update --workspace
          python3 - <<'PY'
          import base64
          s = base64.b64encode(open('Cargo.lock','rb').read()).decode()
          for i in range(0,len(s),8000):
              print('::notice::LOCK%03d %s' % (i//8000,s[i:i+8000]))
          PY
