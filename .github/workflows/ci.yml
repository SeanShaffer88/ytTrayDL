name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV 1.89.0 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --no-self-update
      - name: Check full locked graph on minimum Rust
        shell: bash
        run: |
          set -o pipefail
          if cargo +1.89.0 check --all-targets --locked 2>&1 | tee msrv-check.log; then exit 0; fi
          python -c 'import pathlib; s=pathlib.Path("msrv-check.log").read_text(errors="replace")[-3000:]; print("::error title=MSRV check details::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          exit 1
      - name: Check field harness on minimum Rust
        run: cargo +1.89.0 check --all-targets --features field-validation --locked

  linux-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test release asset verification
        run: python3 -m unittest discover -s tests -p test_release_assets.py
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (host)
        shell: bash
        run: |
          set -o pipefail
          if cargo clippy --all-targets --all-features --locked -- -D warnings 2>&1 | tee host-clippy.log; then exit 0; fi
          python -c 'import pathlib; s=pathlib.Path("host-clippy.log").read_text(errors="replace")[-3000:]; print("::error title=Host clippy details::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          exit 1
      - name: Tests (full suite)
        run: cargo test --locked
      - name: Field harness clippy (host)
        run: cargo clippy --all-targets --features field-validation --locked -- -D warnings

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # ring builds native C/assembly; the Linux runner has no MSVC SDK/lib.exe.
      # Run all Windows checks with the real MSVC toolchain instead of weakening
      # or skipping the target checks on a cross-compilation-only host.
      - name: Clippy (Windows target)
        run: cargo clippy --target x86_64-pc-windows-msvc --all-targets --all-features --locked -- -D warnings
      - name: Windows check
        run: cargo check --target x86_64-pc-windows-msvc --all-targets --all-features --locked
      - name: Field harness clippy (Windows)
        run: cargo clippy --target x86_64-pc-windows-msvc --all-targets --features field-validation --locked -- -D warnings
      - name: Tests (native)
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked --bin yttraydl
      - name: Stage portable payload with dependency notices
        shell: pwsh
        run: |
          $null = New-Item -ItemType Directory -Path windows-payload
          Copy-Item target/release/yttraydl.exe, README.md, LICENSE, THIRD-PARTY-NOTICES.txt -Destination windows-payload
          Set-Content -LiteralPath windows-payload/portable.txt -Value '' -Encoding utf8NoBOM
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: yttraydl-windows
          path: windows-payload/*
      - name: Install Inno Setup 6.7.1
        run: choco install innosetup --version=6.7.1 --no-progress --yes
      - name: Verify actual Inno compiler engine before packaging
        shell: pwsh
        run: |
          $probeRoot = Join-Path $env:RUNNER_TEMP 'inno-version-preflight'
          $null = New-Item -ItemType Directory -Path $probeRoot
          $probe = Join-Path $probeRoot 'version.iss'
          @'
          [Setup]
          AppName=Compiler Version Probe
          AppVersion=1
          DefaultDirName={localappdata}\ytTrayDL-Compiler-Probe
          PrivilegesRequired=lowest
          CreateAppDir=no
          Uninstallable=no
          '@ | Set-Content -LiteralPath $probe -Encoding utf8NoBOM
          # Inno 6 /? exits 1 without the engine version. Compile an inert
          # disposable probe, never execute it, then gate the real package.
          $banner = @(& 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/O$probeRoot" '/Fversion-probe' $probe)
          $code = $LASTEXITCODE
          $banner | Write-Output
          if ($code -ne 0 -or ($banner -join "`n") -notmatch 'Compiler engine version: Inno Setup 6\.7\.1(?:\s|$)') {
            throw "Expected actual Inno engine 6.7.1; preflight exit $code"
          }
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches.Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version installer\yttraydl.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: yttraydl-setup
          path: dist/ytTrayDL-Setup-*.exe

  windows-media-field:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test previous stable selector
        shell: pwsh
        run: |
          try { ./tools/Test-PreviousStable.ps1 } catch {
            $message = "$($_.Exception.Message)`n$($_.InvocationInfo.PositionMessage)".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Previous stable selector test::$message"
            throw
          }
      - name: Test release media evidence export
        shell: pwsh
        run: |
          try { ./tools/Test-ReleaseMediaEvidence.ps1 } catch {
            $message = "$($_.Exception.Message)`n$($_.InvocationInfo.PositionMessage)".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Media evidence exporter test::$message"
            throw
          }
      - name: Build owned process runner
        shell: pwsh
        run: ./tools/Build-InstallerStateProbe.ps1 -Destination "$env:RUNNER_TEMP/process-runner"
      - name: Verify native module intent forwarding
        shell: pwsh
        run: |
          cargo build --locked --example native_intent
          if ($LASTEXITCODE -ne 0) { throw 'Native intent fixture build failed' }
          $runner = "$env:RUNNER_TEMP/process-runner/InstallerStateProbe.exe"
          $fixture = (Resolve-Path './target/debug/examples/native_intent.exe').Path
          & $runner --run-owned 45 $fixture
          if ($LASTEXITCODE -ne 0) { throw "Native module intent fixture failed: $LASTEXITCODE" }
      - name: Resolve hash-pinned real tools
        shell: pwsh
        run: ./tools/Get-FieldTools.ps1 -Destination "$env:RUNNER_TEMP/field-tools" -ProcessRunner "$env:RUNNER_TEMP/process-runner/InstallerStateProbe.exe"
      - name: Test real converter media
        shell: pwsh
        run: |
          $env:YTTRAYDL_TEST_FFMPEG = $env:FIELD_FFMPEG
          $env:YTTRAYDL_TEST_FFPROBE = $env:FIELD_FFPROBE
          cargo test --locked --test converter_media
          if ($LASTEXITCODE -ne 0) { throw "Converter media tests failed: $LASTEXITCODE" }
      - name: Build real media harness
        run: cargo build --locked --features field-validation --bin field_validation
      - name: Exercise real media and process lifecycle
        shell: pwsh
        run: |
          $harness = (Resolve-Path './target/debug/field_validation.exe').Path
          ./tools/Invoke-MediaFieldValidation.ps1 -Harness $harness -YtDlp $env:FIELD_YTDLP -FFmpeg $env:FIELD_FFMPEG -FFprobe $env:FIELD_FFPROBE -Root "$env:RUNNER_TEMP/media-evidence" -Scenario all -TimeoutSeconds 120
          if ($LASTEXITCODE -ne 0) {
            $code = $LASTEXITCODE
            $report = Join-Path $env:RUNNER_TEMP 'media-evidence/evidence.json'
            if (Test-Path -LiteralPath $report) {
              $evidence = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
              $details = @($evidence.scenarios | Where-Object { $_.status -ne 'passed' } | ForEach-Object { "$($_.scenario): $($_.error)" }) -join "`n"
              if ($evidence.error) { $details += "`n$($evidence.error)" }
              $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Media field details::$details"
            }
            throw "Media field assertions failed: $code"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-media-field-evidence
          path: |
            ${{ runner.temp }}/media-evidence
            ${{ runner.temp }}/field-tools/provenance.json
          if-no-files-found: error

  windows-installer-field:
    needs: windows-build
    strategy:
      fail-fast: false
      matrix:
        scenario: [clean, upgrade, upgrade061-off, upgrade070-off, previous-stable]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: yttraydl-setup
          path: candidate-setup
      - uses: actions/download-artifact@v4
        with:
          name: yttraydl-windows
          path: candidate-exe
      - name: Build actual library state consumer
        shell: pwsh
        run: ./tools/Build-InstallerStateProbe.ps1 -Destination "$env:RUNNER_TEMP/state-probe"
      - name: Actual install, selected published-baseline upgrade, and uninstall
        shell: pwsh
        run: |
          $candidate = @(Get-ChildItem candidate-setup -Filter '*.exe' -File)
          if ($candidate.Count -ne 1) { throw 'Expected exactly one candidate installer' }
          try {
            ./tools/Invoke-InstallerLifecycle.ps1 -Scenario '${{ matrix.scenario }}' -Candidate $candidate[0].FullName -CandidateExe './candidate-exe/yttraydl.exe' -StateProbe "$env:RUNNER_TEMP/state-probe/InstallerStateProbe.exe" -EvidenceRoot "$env:RUNNER_TEMP/installer-evidence" -TrustIsolatedRunner
          } catch {
            $message = "$($_.Exception.Message)`n$($_.InvocationInfo.PositionMessage)".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Installer lifecycle details::$message"
            throw
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-${{ matrix.scenario }}-evidence
          path: ${{ runner.temp }}/installer-evidence
          if-no-files-found: error

  windows-installer-tools:
    needs: windows-build
    strategy:
      fail-fast: false
      matrix:
        scenario: [latest, upgrade-latest, offline-failure, skip, existing-both, existing-yt-only, cli-report]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: yttraydl-setup
          path: candidate-setup
      - uses: actions/download-artifact@v4
        with:
          name: yttraydl-windows
          path: candidate-exe
      - name: Build actual owned process runner
        shell: pwsh
        run: ./tools/Build-InstallerStateProbe.ps1 -Destination "$env:RUNNER_TEMP/tools-state-probe"
      - name: Actual tool provisioning, offline failure, or explicit skip
        shell: pwsh
        run: |
          $candidate = @(Get-ChildItem candidate-setup -Filter '*.exe' -File)
          if ($candidate.Count -ne 1) { throw 'Expected exactly one candidate installer' }
          try {
            ./tools/Invoke-InstallerProvisioning.ps1 -Scenario '${{ matrix.scenario }}' -Candidate $candidate[0].FullName -CandidateExe './candidate-exe/yttraydl.exe' -StateProbe "$env:RUNNER_TEMP/tools-state-probe/InstallerStateProbe.exe" -EvidenceRoot "$env:RUNNER_TEMP/installer-tools-evidence" -TrustIsolatedRunner
          } catch {
            $message = "$($_.Exception.Message)`n$($_.InvocationInfo.PositionMessage)".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Installer provisioning details::$message"
            throw
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-tools-${{ matrix.scenario }}-evidence
          path: ${{ runner.temp }}/installer-tools-evidence
          if-no-files-found: error
