name: Fuzz smoke
on:
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Smoke URL input
        run: cargo +nightly fuzz run url_input -- -max_total_time=60 -max_len=65536
      - name: Smoke clipboard input
        run: cargo +nightly fuzz run clipboard_input -- -max_total_time=60 -max_len=65536
      - name: Smoke release signature input
        run: cargo +nightly fuzz run release_signature -- -max_total_time=60 -max_len=73732
