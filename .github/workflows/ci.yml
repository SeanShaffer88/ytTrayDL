name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (host)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy (Windows target)
        run: cargo clippy --target x86_64-pc-windows-msvc --all-targets --locked -- -D warnings
      - name: Tests (full suite)
        run: cargo test --locked
      - name: Windows check
        run: cargo check --target x86_64-pc-windows-msvc --all-targets --locked

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Tests (native)
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: yttraydl-windows
          path: target/release/yttraydl.exe
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches.Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version installer\yttraydl.iss
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: yttraydl-setup
          path: dist/ytTrayDL-Setup-*.exe
